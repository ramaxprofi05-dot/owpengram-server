name: FemboyGram Server

on:
  push:
    branches: [femboygram]
    paths:
      - '**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: femboygram-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize the pinned sibling OwpenGram TL module
        run: |
          git clone --depth 1 --branch femboygram-layer-232 https://github.com/ramaxprofi05-dot/owpengram-td.git ../owpengram-td
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - name: Compile admin API and run FemboyGram tests
        run: |
          go test ./cmd/telesrv-admin -run "^$"
          go test ./internal/branding ./internal/links ./internal/plugins
          go test ./internal/rpc -run TestFemboyGram
          go test ./internal/config -run TestLoadDefaultsAdvertiseIPToLoopback
          go test ./internal/domain -run 'TestServiceIdentityAndLoginMessageUseFemboyGramBrand|TestRenderWelcomeMessageTemplateSubstitutesServerName'
          go test ./internal/app/langpack -run TestServiceRebrandsEveryLanguagePackProjection
          go test ./internal/app/auth -run 'TestSignUpWritesOfficialLoginMessage|TestEmailSetupVerificationAuthorizesSignUpWithWelcomeMessageOnlyNoCodeEcho'

  admin-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cmd/telesrv-admin/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/telesrv-admin/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build admin panel
        run: npm run build
